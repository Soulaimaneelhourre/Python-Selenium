<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mini E-Commerce</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="profile-management">
            <h2>User Profile Management</h2>
            
            <div class="profile-tabs">
                <button class="tab-button active" onclick="openTab('profile-info')">Profile Information</button>
                <button class="tab-button" onclick="openTab('change-password')">Change Password</button>
            </div>
            
            <div id="profile-info" class="tab-content" style="display: block;">
                <form id="profileForm">
                    <div>
                        <label for="full-name">Full Name:</label>
                        <input type="text" id="full-name">
                    </div>
                    <div>
                        <label for="profile-email">Email:</label>
                        <input type="email" id="profile-email" disabled>
                    </div>
                    <div>
                        <label for="address">Address:</label>
                        <textarea id="address" rows="3"></textarea>
                    </div>
                    <div>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone">
                    </div>
                    <button type="submit">Update Profile</button>
                </form>
                <div id="profile-update-result"></div>
            </div>
            
            <div id="change-password" class="tab-content">
                <form id="passwordForm">
                    <div>
                        <label for="current-password">Current Password:</label>
                        <input type="password" id="current-password" required>
                        <div id="current-password-error" class="error-message"></div>
                    </div>
                    <div>
                        <label for="new-password">New Password:</label>
                        <input type="password" id="new-password" required minlength="6">
                        <div id="new-password-error" class="error-message"></div>
                    </div>
                    <div>
                        <label for="confirm-new-password">Confirm New Password:</label>
                        <input type="password" id="confirm-new-password" required>
                        <div id="confirm-new-password-error" class="error-message"></div>
                    </div>
                    <button type="submit">Change Password</button>
                </form>
                <div id="password-change-result"></div>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
